<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>Để B0DY kể về bạn</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" href="fonts/ArchivoExtraCondensed-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/SVN-Switzer-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ke.css?v=1.9.0">
</head>
<body>
<!-- Hành trình "Để B0DY kể về bạn": trang đặt lịch (app.js) để sẵn dữ liệu câu chuyện trong sessionStorage rồi mở trang này.
     Không có dữ liệu (mở thẳng đường dẫn, phiên khác) → quay về trang đặt lịch. Trang này không gọi máy chủ (connect-src 'none'). -->
<button class="side prev" id="sprev" type="button" aria-label="Khoảnh khắc trước"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12.5 4L6.5 10l6 6"/></svg></button>
<main id="app" aria-roledescription="câu chuyện" aria-label="Để B0DY kể về bạn">
  <div class="top" id="top">
    <div class="segs" id="segs" aria-hidden="true"></div>
    <div class="nav">
      <button id="close" type="button" aria-label="Về trang đặt lịch">← Đặt lịch</button>
      <span class="sr" id="pos" aria-live="polite"></span>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="wipe" id="wipe"></div>
</main>
<button class="side next" id="snext" type="button" aria-label="Khoảnh khắc tiếp"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7.5 4l6 6-6 6"/></svg></button>
<div id="printpage" aria-hidden="true"></div>
<noscript><p class="nojs">Trang này cần bật JavaScript.</p></noscript>
<script src="ke-core.js?v=1.9.0" defer></script>
<script src="ke-b0b.js?v=1.9.0" defer></script>
<script src="ke.js?v=1.9.0" defer></script>
</body>
</html>
